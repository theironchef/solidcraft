    <text transform="matrix(1 0 0 1 40 72)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">A closed surface names each point once per period: u and u + 1 are the same point. The trace and the sort run along the edge&apos;s trim curve.</tspan></text>
