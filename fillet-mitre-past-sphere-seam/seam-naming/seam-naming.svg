    <text transform="matrix(1 0 0 1 118.045 231)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">main: the corner&apos;s solve names</tspan></text>
