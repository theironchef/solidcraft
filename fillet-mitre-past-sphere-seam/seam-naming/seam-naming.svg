    <text transform="matrix(1 0 0 1 1005.433 606)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">u = 1.02 lies</tspan></text>
