    <text transform="matrix(1 0 0 1 631.194 370)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000" text-anchor="end"><tspan x="0" y="0">trim end, keeps its name</tspan></text>
    <text transform="matrix(1 0 0 1 631.194 417)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000" text-anchor="end"><tspan x="0" y="0">edge&apos;s trim curve</tspan></text>
