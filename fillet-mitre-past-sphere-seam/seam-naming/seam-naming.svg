    <text transform="matrix(1 0 0 1 1005.433 640)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">the cylinder there</tspan></text>
    <text transform="matrix(1 0 0 1 1005.433 657)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">is its extension,</tspan></text>
    <text transform="matrix(1 0 0 1 1005.433 674)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">0.007 off at r = 30</tspan></text>
    <text transform="matrix(1 0 0 1 1005.433 691)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">0.008 past the seam</tspan></text>
    <text transform="matrix(1 0 0 1 40 862)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">Rule (c1_collect_points): each rail end&apos;s foot is moved by whole periods to the name nearest its edge&apos;s trim end, when that is strictly nearer. The new names are taken</tspan></text>
    <text transform="matrix(1 0 0 1 40 879)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">on a surface only where some of its feet lie across the seam and some do not. A direction that collapses at the foot (a sphere&apos;s pole) is never renamed.</tspan></text>
